<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味互动</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "微软雅黑",sans-serif;}
        body{padding:20px 15px;text-align:center;background:#f5f5f5;}
        .page{display:none;}
        .active{display:block;}
        h2{margin:20px 0 10px;font-size:22px;color:#333;}
        p{color:#666;margin-bottom:15px;}
        .main-img{
            width:80%;
            max-width:300px;
            border-radius:10px;
            margin:20px auto;
        }
        .btn{
            display:block;
            width:80%;
            margin:15px auto;
            padding:14px;
            font-size:18px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
        .btn-no{background:#ccc;color:#333;}
        .btn-yes{background:#ff4444;color:#fff;}
        .pay-box{
            width:90%;
            margin:20px auto;
            padding:20px;
            background:#fff;
            border-radius:10px;
            box-shadow:0 0 10px #ddd;
        }
        .pay-img{
            width:100%;
            max-width:280px;
            border-radius:8px;
            margin:15px auto;
        }
        .pay-btn{
            background:#07c160;
            color:#fff;
        }
        .thank-text{
            margin-top:30px;
            font-size:20px;
            line-height:2.2;
            color:#222;
        }
    </style>
</head>
<body>

<div class="page active" id="page1">
    <h2>要不要支持一下？</h2>
    <img class="main-img" src="out.gif" alt="配图">
    <button class="btn btn-no" onclick="closePage()">不要</button>
    <button class="btn btn-yes" onclick="goPay()">好的哥哥</button>
</div>

<div class="page" id="page2">
    <div class="pay-box">
        <h3>模拟付款界面</h3>
        <img class="pay-img" src="tou.jpg" alt="付款配图">
        <p style="margin:20px 0;font-size:16px;">金额：¥8.88</p>
        <button class="btn pay-btn" onclick="goThank()">确认付款</button>
    </div>
</div>

<div class="page" id="page3">
    <img class="main-img" src="tuo.jpg" alt="感谢配图">
    <div class="thank-text">
        <p>感谢你的乐捐</p>
        <p>好人一生平安 ✨</p>
    </div>
</div>

<script>
function closePage(){
    alert("溜啦溜啦~");
    window.close();
}
function goPay(){
    document.getElementById('page1').classList.remove('active');
    document.getElementById('page2').classList.add('active');
}
function goThank(){
    document.getElementById('page2').classList.remove('active');
    document.getElementById('page3').classList.add('active');
}
</script>

</body>
</html>
